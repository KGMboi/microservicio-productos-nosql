name: productos-prod

services:
  mongo:
    image: mongo:7
    container_name: productos-prod-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: productosdb
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    image: productos-api:1.2.0
    container_name: productos-prod-app
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://${APP_DB_USER}:${APP_DB_PASSWORD}@mongo:27017/productosdb?authSource=productosdb
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
      - frontend

  caddy:
    image: caddy:2
    container_name: productos-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - frontend

networks:
  # frontend: Caddy y la API. backend: API y MongoDB, sin salida a internet ni puertos publicados
  frontend:
  backend:
    internal: true

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
