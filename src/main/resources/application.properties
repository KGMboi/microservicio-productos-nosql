spring.application.name=microservicio-productos
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/productosdb}
spring.data.mongodb.auto-index-creation=true

# Seguridad: la llave y la contraseña del administrador se leen de variables de entorno
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
app.admin.usuario=${ADMIN_USER:admin}
app.admin.contrasena=${ADMIN_PASSWORD:}
